# Runs the test suite, publishes the page to GitHub Pages only if it passes,
# and then cuts the GitHub Release for the version in the file.
# A failing suite leaves the live site on the last good version.
#
# Pages must be set to build from GitHub Actions for the deploy job to work
# (Settings -> Pages -> Source: GitHub Actions), not from a branch.
name: Test, deploy and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race; queue them instead of cancelling, so the last
# push always ends up being the one that is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cheap and first: proves every sabotage anchor still matches the page.
      # Anchors are text from index.html, so a refactor can silently disarm a
      # guard; this fails the push instead of letting it report SKIP in a run
      # nobody does for weeks. Only checks the anchors -- the full sabotage
      # run takes about 15 minutes and stays manual. See tests/README.md.
      - name: Sabotage anchors still match
        run: python3 sabotage.py --check
        working-directory: tests
      - uses: actions/setup-node@v4
        with:
          node-version: '20'          # tests/package.json requires >=20
      - run: npm ci
        working-directory: tests
      - run: npm test
        working-directory: tests

  deploy:
    name: Deploy to Pages
    needs: test                        # only runs if the suite passed
    # Pushes to main deploy; so does a manual run from the Actions tab
    # ("Run workflow"), which is how to re-deploy without a new commit.
    # Pull requests are excluded: they run the tests and stop there.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A fresh checkout, so the artifact can't pick up tests/node_modules
      # from the test job.
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Release
    needs: deploy                      # only after the page is actually live
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write                  # create the tag and the release
    steps:
      - uses: actions/checkout@v4
      # APP_VERSION is the single source of truth. The test job has already
      # checked that the header comment, the <title> and the changelog
      # heading all agree with it, so by here the version is trustworthy.
      - id: v
        run: |
          set -euo pipefail
          V=$(sed -n 's/^const APP_VERSION = "\(.*\)";$/\1/p' index.html)
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no usable APP_VERSION (got '$V')"; exit 1; }
          echo "v=$V" >> "$GITHUB_OUTPUT"
      # A push that didn't bump the version (a docs tweak, or a re-run from
      # the Actions tab) has nothing to release. Not an error; just stop.
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.v.outputs.v }}" >/dev/null 2>&1; then
            echo "v${{ steps.v.outputs.v }} is already released; nothing to do"
            echo "todo=no" >> "$GITHUB_OUTPUT"
          else
            echo "todo=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.todo == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.v.outputs.v }}
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          # The release notes ARE the changelog section for this version:
          # everything between its heading and the next one.
          awk -v v="## [$V]" 'index($0,v)==1{f=1;next} /^## \[/{f=0} f' index.html > "$TMP/notes.md"
          # --notes-file, never --notes: changelog bodies contain backticks.
          grep -q '[^[:space:]]' "$TMP/notes.md" || { echo "::error::changelog section for $V is empty"; exit 1; }
          # The pinned copy the "keep your own copy" link points at. Named
          # exactly this or that link 404s (see VERSIONING in index.html).
          # Built in a temp dir, never in the repo root, which Pages uploads.
          cp index.html "$TMP/bluesky-catchup-v$V.html"
          # Creates the tag (lightweight, like every other tag here) at this
          # commit; no push, so this can't retrigger the workflow.
          gh release create "v$V" "$TMP/bluesky-catchup-v$V.html" \
            --title "$V" --notes-file "$TMP/notes.md" --target "$GITHUB_SHA"
